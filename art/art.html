<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>樣品</title>
<style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// ================= Q 版角色（同一份設計，畫成向量版或像素版） =================
const SECT={
  sword:{n:'青雲劍宗',robe:'#eef4fb',shade:'#bccde4',trim:'#3a7fd0',trim2:'#2a5c9a',hair:'#2a2638',hair2:'#433d5c',iris:'#3a7fd0',acc:'sword'},
  sword_x:{n:'血魔劍',robe:'#3a2430',shade:'#24161e',trim:'#d0303a',trim2:'#8a1a22',hair:'#e8e4f0',hair2:'#b8b0cc',iris:'#e0303a',acc:'sword',evil:1},
  pill:{n:'百草丹谷',robe:'#eef6e4',shade:'#c4dcae',trim:'#3c9a52',trim2:'#2a6c3a',hair:'#5a3424',hair2:'#7c4a34',iris:'#3c9a52',acc:'pill'},
  talis:{n:'紫霄符府',robe:'#f1eafb',shade:'#cdbbe8',trim:'#7a4fd0',trim2:'#56349a',hair:'#1e1a2c',hair2:'#38304e',iris:'#8a5ae0',acc:'talis'},
  vajra:{n:'金剛寺',robe:'#f5b84c',shade:'#d48a2c',trim:'#b5432a',trim2:'#7e2a1a',hair:'#f2c9a0',hair2:'#e0b088',iris:'#5a3a20',acc:'vajra',skin:'#f6cfa4'},
};
const OUT='#2b1d2a',SKIN='#ffdcc0',SKIN2='#f2bea0';
function P(ctx,pts){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}
// vec=true：加描邊與漸層；false：純色（給像素化用）
function chibi(ctx,o,vec,pose={}){
  const sk=o.skin||SKIN;ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  const ol=()=>{if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.stroke()}};
  const fill=(c,c2,y0,y1)=>{if(vec&&c2){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c);g.addColorStop(1,c2);ctx.fillStyle=g}else ctx.fillStyle=c;ctx.fill()};
  // 背後配件
  if(o.acc==='sword'){ctx.save();ctx.translate(9,-4);ctx.rotate(-.55);
    ctx.fillStyle=o.hilt||(o.evil?'#5a1a24':'#6a4a2a');ctx.fillRect(-2.5,-30,5,10);if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=1.6;ctx.strokeRect(-2.5,-30,5,10)}
    ctx.fillStyle='#e8c050';ctx.fillRect(-6,-21,12,3.5);if(vec)ctx.strokeRect(-6,-21,12,3.5);ctx.restore()}
  if(o.acc==='pill'){ctx.save();ctx.translate(-12,8);ctx.beginPath();ctx.arc(0,4,6,0,7);ctx.arc(0,-4,4,0,7);fill('#e8a040','#c47020',-8,10);ol();ctx.fillStyle='#c0402a';ctx.fillRect(-4,-1,8,2);ctx.restore()}
  // 披風
  if(o.cape){ctx.beginPath();ctx.moveTo(-10,0);ctx.quadraticCurveTo(-24,18,-20,33);ctx.quadraticCurveTo(0,37,20,33);ctx.quadraticCurveTo(24,18,10,0);fill(o.cape,o.cape2||o.cape,0,34);ol()}
  if(o.hairStyle==='long'){ctx.beginPath();ctx.moveTo(-20,-14);ctx.quadraticCurveTo(-24,14,-15,24);ctx.lineTo(15,24);ctx.quadraticCurveTo(24,14,20,-14);ctx.closePath();fill(o.hair2,o.hair,-14,24);ol()}
  // 後髮
  if(o.acc!=='vajra'){ctx.beginPath();ctx.ellipse(0,-15,23,22,0,0,7);if(o.acc==='sword'){ctx.moveTo(-6,0);ctx.quadraticCurveTo(-4,18,4,16);ctx.quadraticCurveTo(10,10,8,0)}fill(o.hair,o.hair2,-37,10);ol()}
  // 腿
  for(const sx of [-1,1]){ctx.beginPath();ctx.roundRect(sx*5-3.5,24+(pose.step?sx*pose.step:0),7,10,3);fill('#3a3046','#2a2234',24,34);ol()}
  // 身體（道袍）
  ctx.beginPath();ctx.moveTo(-11,2);ctx.lineTo(11,2);ctx.quadraticCurveTo(15,16,16,27);ctx.quadraticCurveTo(0,31,-16,27);ctx.quadraticCurveTo(-15,16,-11,2);fill(o.robe,o.shade,2,30);ol();
  ctx.save();ctx.clip();ctx.fillStyle=o.shade;ctx.globalAlpha=vec?.55:1;ctx.beginPath();ctx.moveTo(4,2);ctx.lineTo(18,2);ctx.lineTo(18,32);ctx.lineTo(7,32);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=o.trim;ctx.fillRect(-20,24,40,8);ctx.fillStyle=o.trim2;ctx.fillRect(-20,13,40,3.5);
  if(o.pattern==='cloud'){ctx.strokeStyle=o.trim;ctx.lineWidth=1.3;for(const [x,y] of [[-7,20],[6,19]]){ctx.beginPath();ctx.arc(x,y,2.4,3.4,6.6);ctx.arc(x+3.4,y,2,3.4,6.4);ctx.stroke()}}
  if(o.pattern==='flame'){ctx.fillStyle='#ffb040';for(let x=-16;x<16;x+=5){ctx.beginPath();ctx.moveTo(x,24);ctx.quadraticCurveTo(x+1,19,x+2.5,16);ctx.quadraticCurveTo(x+3,20,x+5,24);ctx.fill()}}
  if(o.pattern==='gold'){ctx.fillStyle='#e8c050';ctx.fillRect(-20,23,40,1.6);ctx.fillRect(-20,30,40,1.2);ctx.fillRect(-1,16,2,8)}
  if(o.pattern==='sakura'){ctx.fillStyle='#ffd0dc';for(const [x,y] of [[-8,8],[6,20],[-3,21],[9,7],[-12,19]]){for(let k=0;k<5;k++){const a=k*1.256;ctx.beginPath();ctx.arc(x+Math.cos(a)*1.3,y+Math.sin(a)*1.3,1,0,7);ctx.fill()}}}
  ctx.restore();
  // 衣領
  ctx.fillStyle=o.trim;P(ctx,[[-7,2],[0,11],[7,2],[4,2],[0,7],[-4,2]]);ctx.fill();
  if(o.acc==='vajra'){ctx.fillStyle='#7a3a1a';for(let i=0;i<9;i++){const a=Math.PI*(.15+i*.0875);ctx.beginPath();ctx.arc(Math.cos(a)*10,2+Math.sin(a)*8,1.8,0,7);ctx.fill()}}
  // 手
  const arm=pose.arm||0;
  for(const sx of [-1,1]){ctx.save();ctx.translate(sx*13,8);ctx.rotate(sx*(.25+(sx>0?arm:0)));ctx.beginPath();ctx.ellipse(0,5,4.5,8,0,0,7);fill(o.robe,o.shade,-3,13);ol();ctx.beginPath();ctx.arc(0,12,3.6,0,7);ctx.fillStyle=sk;ctx.fill();ol();ctx.restore()}
  // 手上的東西
  if(o.acc==='talis'){ctx.save();ctx.translate(16,18);ctx.rotate(.3);ctx.fillStyle='#f6e7a8';ctx.fillRect(-3.5,-7,7,13);if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=1.4;ctx.strokeRect(-3.5,-7,7,13)}ctx.fillStyle='#d03a2a';ctx.fillRect(-1,-5,2,9);ctx.fillRect(-2.5,-2,5,1.4);ctx.restore()}
  if(o.acc==='vajra'){ctx.save();ctx.translate(-17,10);ctx.fillStyle='#8a5a2a';ctx.fillRect(-1.6,-26,3.2,40);if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=1.4;ctx.strokeRect(-1.6,-26,3.2,40)}
    ctx.strokeStyle='#e8c050';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-28,4,0,7);ctx.stroke();ctx.restore()}
  // 頭
  ctx.beginPath();ctx.ellipse(0,-14,20,19,0,0,7);ctx.fillStyle=sk;ctx.fill();ol();
  ctx.beginPath();ctx.ellipse(0,-14,20,19,0,0,7);ctx.save();ctx.clip();ctx.fillStyle=o.skin?'#e8b888':SKIN2;ctx.globalAlpha=vec?.5:1;ctx.beginPath();ctx.ellipse(6,0,16,10,0,0,7);ctx.fill();ctx.restore();ctx.globalAlpha=1;
  // 眼睛
  const ey=-11,blink=pose.blink;
  for(const sx of [-1,1]){const x=sx*8;
    if(blink){ctx.strokeStyle='#2a1a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-3.5,ey+1);ctx.quadraticCurveTo(x,ey+3,x+3.5,ey+1);ctx.stroke();continue}
    ctx.fillStyle='#24182a';ctx.beginPath();ctx.ellipse(x,ey,4.2,5.6,0,0,7);ctx.fill();
    ctx.fillStyle=o.iris;ctx.beginPath();ctx.ellipse(x,ey+1.6,3,3.2,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-1.4,ey-2.2,1.6,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+1.6,ey+2,.8,0,7);ctx.fill();
    if(o.evil){ctx.strokeStyle='#24182a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-4.5*sx*-1-sx*0,ey-8+ (sx>0?1:-1)*0);ctx.lineTo(x+sx*4.5,ey-5.5);ctx.stroke()}}
  // 腮紅、嘴
  ctx.fillStyle='#ff8fa0';ctx.globalAlpha=vec?.55:1;for(const sx of [-1,1]){ctx.beginPath();ctx.ellipse(sx*13,-4,3.2,1.8,0,0,7);ctx.fill()}ctx.globalAlpha=1;
  ctx.strokeStyle='#6a2a2a';ctx.lineWidth=1.5;ctx.beginPath();if(o.evil){ctx.moveTo(-3,-2);ctx.quadraticCurveTo(0,-3.5,3,-1)}else{ctx.moveTo(-2.5,-3);ctx.quadraticCurveTo(0,-.5,2.5,-3)}ctx.stroke();
  // 前髮／頭飾
  if(o.acc==='vajra'){ctx.fillStyle='#c48a5a';for(const [x,y] of [[-5,-27],[0,-28.5],[5,-27],[-5,-23],[0,-24.5],[5,-23]]){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}}
  else{ctx.beginPath();ctx.moveTo(-21,-12);ctx.quadraticCurveTo(-23,-36,0,-36);ctx.quadraticCurveTo(23,-36,21,-12);
    ctx.lineTo(17,-18);ctx.lineTo(14,-14);ctx.lineTo(10,-21);ctx.lineTo(5,-17);ctx.lineTo(1,-23);ctx.lineTo(-4,-18);ctx.lineTo(-9,-22);ctx.lineTo(-13,-15);ctx.lineTo(-17,-19);ctx.closePath();fill(o.hair2,o.hair,-36,-12);ol();
    if(vec){ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-4,-28,9,3.6,4.6);ctx.stroke()}}
  if(o.acc==='sword'){ctx.beginPath();ctx.ellipse(0,-38,7,5.5,0,0,7);fill(o.hair2,o.hair,-44,-32);ol();ctx.fillStyle='#e8c050';ctx.fillRect(-11,-39,22,2.2)}
  if(o.acc==='pill'){for(const sx of [-1,1]){ctx.beginPath();ctx.arc(sx*15,-33,6,0,7);fill(o.hair2,o.hair,-39,-27);ol()}ctx.fillStyle='#5fd07a';ctx.beginPath();ctx.ellipse(15,-38,4,2,-.6,0,7);ctx.fill()}
  if(o.head==='crown'){ctx.beginPath();ctx.moveTo(-9,-40);ctx.lineTo(-9,-46);ctx.lineTo(-4.5,-42);ctx.lineTo(0,-49);ctx.lineTo(4.5,-42);ctx.lineTo(9,-46);ctx.lineTo(9,-40);ctx.closePath();fill('#ffe27a','#d89c2a',-49,-40);ol();ctx.fillStyle='#e0303a';ctx.beginPath();ctx.arc(0,-43,1.6,0,7);ctx.fill()}
  if(o.head==='mask'){ctx.save();ctx.translate(15,-30);ctx.rotate(.4);ctx.beginPath();ctx.moveTo(-6,-4);ctx.lineTo(-7,-11);ctx.lineTo(-2,-6);ctx.lineTo(2,-6);ctx.lineTo(7,-11);ctx.lineTo(6,-4);ctx.quadraticCurveTo(6,5,0,7);ctx.quadraticCurveTo(-6,5,-6,-4);fill('#ffffff','#e8e0e8',-11,7);ol();ctx.fillStyle='#e0303a';ctx.fillRect(-4,-2,3,1.2);ctx.fillRect(1,-2,3,1.2);ctx.fillRect(-.6,1,1.2,3);ctx.restore()}
  if(o.head==='flower'){for(let k=0;k<5;k++){const a=k*1.256;ctx.fillStyle='#ffb0c8';ctx.beginPath();ctx.arc(-14+Math.cos(a)*3,-31+Math.sin(a)*3,2.6,0,7);ctx.fill()}ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(-14,-31,1.6,0,7);ctx.fill()}
  if(o.acc==='talis'){ctx.beginPath();ctx.moveTo(-12,-33);ctx.lineTo(12,-33);ctx.lineTo(9,-43);ctx.lineTo(-9,-43);ctx.closePath();fill('#2a2438','#16121e',-43,-33);ol();ctx.fillStyle='#e8c050';ctx.fillRect(-2,-41,4,5)}
  ctx.restore()}
// ---- 妖獸 ----
function wolf(ctx,vec,col='#8a94a8',col2='#5c6478',angry=1){ctx.save();ctx.lineJoin='round';const ol=()=>{if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.stroke()}};
  const fill=(c,c2,y0,y1)=>{if(vec){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c);g.addColorStop(1,c2);ctx.fillStyle=g}else ctx.fillStyle=c;ctx.fill()};
  ctx.beginPath();ctx.moveTo(14,2);ctx.quadraticCurveTo(30,-8,28,-18);ctx.quadraticCurveTo(22,-4,12,-2);fill(col,col2,-18,4);ol(); // 尾巴
  ctx.beginPath();ctx.ellipse(4,4,17,12,0,0,7);fill(col,col2,-8,16);ol();
  for(const x of [-6,4,12]){ctx.beginPath();ctx.roundRect(x-3,10,6,8,2.5);fill(col2,col2,10,18);ol()}
  ctx.beginPath();ctx.ellipse(-10,-6,14,13,0,0,7);fill(col,col2,-19,7);ol();
  for(const sx of [-1,1]){ctx.beginPath();ctx.moveTo(-10+sx*5-4,-15);ctx.lineTo(-10+sx*8,-27);ctx.lineTo(-10+sx*9+3,-13);ctx.closePath();fill(col,col2,-27,-13);ol();ctx.fillStyle='#ff9aa8';ctx.beginPath();ctx.moveTo(-10+sx*6,-16);ctx.lineTo(-10+sx*8,-23);ctx.lineTo(-10+sx*9.5,-15);ctx.fill()}
  ctx.beginPath();ctx.ellipse(-18,-1,7,5,0,0,7);ctx.fillStyle='#e8ecf2';ctx.fill();ol();ctx.fillStyle='#2a1a24';ctx.beginPath();ctx.arc(-24,-3,2,0,7);ctx.fill();
  for(const x of [-15,-6]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,-8,3.4,4,0,0,7);ctx.fill();ctx.fillStyle='#e0303a';ctx.beginPath();ctx.arc(x-.6,-7.4,2,0,7);ctx.fill();ctx.fillStyle='#2a1a24';ctx.beginPath();ctx.arc(x-.6,-7.4,1,0,7);ctx.fill();
    if(angry){ctx.strokeStyle='#2a1a24';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-4,-13+(x<-10?0:2));ctx.lineTo(x+4,-13+(x<-10?2:0));ctx.stroke()}}
  ctx.fillStyle='#fff';P(ctx,[[-21,3],[-19.5,7],[-18,3]]);ctx.fill();P(ctx,[[-16,3],[-14.5,6.5],[-13,3]]);ctx.fill();ctx.restore()}
function wisp(ctx,vec,col='#6fe0b0',col2='#2a9a7a'){ctx.save();ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,-26);ctx.quadraticCurveTo(6,-14,12,-8);ctx.quadraticCurveTo(18,6,8,12);ctx.quadraticCurveTo(0,16,-8,12);ctx.quadraticCurveTo(-18,6,-12,-8);ctx.quadraticCurveTo(-4,-16,0,-26);
  if(vec){const g=ctx.createRadialGradient(0,2,2,0,0,20);g.addColorStop(0,'#e8fff4');g.addColorStop(.5,col);g.addColorStop(1,col2);ctx.fillStyle=g}else ctx.fillStyle=col;ctx.fill();if(vec){ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.stroke()}
  ctx.fillStyle='#1a2a2a';for(const x of [-5,5]){ctx.beginPath();ctx.ellipse(x,0,2.4,3.4,0,0,7);ctx.fill()}ctx.fillStyle='#fff';for(const x of [-5.8,4.2]){ctx.beginPath();ctx.arc(x,-1.2,1,0,7);ctx.fill()}
  ctx.strokeStyle='#1a2a2a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,5,2.5,.2,Math.PI-.2);ctx.stroke();ctx.restore()}
// ================= 像素化：用低解析度畫一次，再把顏色吸附到調色盤、加描邊 =================
function pixelize(draw,w,h,scale,pal){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.translate(w/2,h*.62);x.scale(scale,scale);draw(x);
  const im=x.getImageData(0,0,w,h),d=im.data,P=pal.map(hx=>[parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)]);
  for(let i=0;i<d.length;i+=4){if(d[i+3]<110){d[i+3]=0;continue}let b=0,bd=1e9;for(let k=0;k<P.length;k++){const q=P[k],dd=(d[i]-q[0])**2+(d[i+1]-q[1])**2+(d[i+2]-q[2])**2;if(dd<bd){bd=dd;b=k}}d[i]=P[b][0];d[i+1]=P[b][1];d[i+2]=P[b][2];d[i+3]=255}
  const op=i=>d[i*4+3]>0,o=new Uint8ClampedArray(d);const oc=[43,29,42];
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=y*w+xx;if(op(i))continue;if((xx>0&&op(i-1))||(xx<w-1&&op(i+1))||(y>0&&op(i-w))||(y<h-1&&op(i+w))){o[i*4]=oc[0];o[i*4+1]=oc[1];o[i*4+2]=oc[2];o[i*4+3]=255}}
  x.setTransform(1,0,0,1,0,0);x.putImageData(new ImageData(o,w,h),0,0);return c}
const palOf=o=>[o.robe,o.shade,o.trim,o.trim2,o.hair,o.hair2,o.iris,o.skin||SKIN,o.skin?'#e8b888':SKIN2,'#24182a','#ffffff','#ff8fa0','#6a2a2a','#3a3046','#e8c050','#6a4a2a','#5a1a24','#e8a040','#c0402a','#5fd07a','#f6e7a8','#d03a2a','#8a5a2a','#7a3a1a','#c48a5a','#2a2438'];
function pixChibi(o,pose){return pixelize(x=>chibi(x,o,false,pose),34,44,.5,palOf(o))}
// ================= 共用：背景 =================
function sky(ctx,W,H,top,bot){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function mountains(ctx,W,H,y,col,amp,seed){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=W/24){const n=Math.sin(x*.011+seed)*.6+Math.sin(x*.027+seed*2)*.4;ctx.lineTo(x,y-amp*(.5+n*.5))}ctx.lineTo(W,H);ctx.fill()}
let R=1;const rnd=()=>{R=(R*16807)%2147483647;return R/2147483647};
// ================= 圖 1：角色一覽 =================
function lineup(ctx,W,H,pix){sky(ctx,W,H,'#2a2142','#120e1a');mountains(ctx,W,H,H*.62,'#231c36',90,1);mountains(ctx,W,H,H*.7,'#1b1529',60,3);
  ctx.fillStyle='#ffffff10';for(let i=0;i<60;i++){R=i*97+3;ctx.fillRect(rnd()*W,rnd()*H*.5,2,2)}
  ctx.fillStyle='#f2c14e';ctx.font='bold 44px "Noto Sans TC","PingFang TC",sans-serif';ctx.textAlign='center';ctx.fillText('萬妖仙途・Q版角色'+(pix?'（像素風）':'（向量風）'),W/2,70);
  ctx.fillStyle='#b9ad96';ctx.font='20px "Noto Sans TC",sans-serif';ctx.fillText('四大門派＋邪道範例・妖獸',W/2,104);
  const list=['sword','pill','talis','vajra','sword_x'];const gw=W/6.2;
  list.forEach((k,i)=>{const o=SECT[k],cx=gw*(i+.85),cy=H*.52;
    ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(cx,cy+118,62,14,0,0,7);ctx.fill();
    if(o.evil){ctx.save();const g=ctx.createRadialGradient(cx,cy,10,cx,cy,150);g.addColorStop(0,'#ff2a3a40');g.addColorStop(1,'#ff2a3a00');ctx.fillStyle=g;ctx.fillRect(cx-160,cy-170,320,320);ctx.restore()}
    if(pix){const c=pixChibi(o),k=5;ctx.imageSmoothingEnabled=false;ctx.drawImage(c,cx-c.width*k/2,cy+118-c.height*k,c.width*k,c.height*k)}
    else{ctx.save();ctx.translate(cx,cy+8);ctx.scale(3.4,3.4);chibi(ctx,o,true);ctx.restore()}
    ctx.fillStyle=o.evil?'#ff8a8a':o.trim==='#3c9a52'?'#8fe0a0':o.trim==='#7a4fd0'?'#c9a8ff':o.trim==='#b5432a'?'#ffc870':'#9fd0ff';ctx.font='bold 24px "Noto Sans TC",sans-serif';ctx.fillText(o.n,cx,cy+165);
    ctx.fillStyle='#b9ad96';ctx.font='16px "Noto Sans TC",sans-serif';ctx.fillText(o.evil?'青雲劍宗・邪道':['飛劍','煉丹','雷符','體修'][i],cx,cy+190)});
  // 妖獸
  const mx=gw*5.75;ctx.fillStyle='#b9ad96';ctx.font='bold 20px "Noto Sans TC",sans-serif';ctx.fillText('妖獸',mx,H*.27);
  if(pix){const a=pixelize(x=>wolf(x,false),40,30,.62,['#8a94a8','#5c6478','#ff9aa8','#e8ecf2','#2a1a24','#ffffff','#e0303a']),b=pixelize(x=>wisp(x,false),28,34,.6,['#6fe0b0','#2a9a7a','#1a2a2a','#ffffff','#e8fff4']);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(a,mx-a.width*2.6,H*.38-a.height*2.6,a.width*5.2,a.height*5.2);ctx.drawImage(b,mx-b.width*2.6,H*.66-b.height*2.6,b.width*5.2,b.height*5.2)}
  else{ctx.save();ctx.translate(mx+6,H*.4);ctx.scale(2.6,2.6);wolf(ctx,true);ctx.restore();ctx.save();ctx.translate(mx,H*.68);ctx.scale(2.6,2.6);wisp(ctx,true);ctx.restore()}
