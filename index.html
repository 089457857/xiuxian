<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14101c">
<link rel="manifest" href="manifest.json">
<title>萬妖仙途</title>
<style>
:root{--ink:#f3ead7;--dim:#b9ad96;--gold:#f2c14e;--red:#e0524a;--jade:#5fd0a0;--bg:#14101c;--card:#211a2c;--line:#3b3048;--z:#7fc4ff;--x:#e0524a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 18px);background:radial-gradient(ellipse at 50% 0%,#2c2140 0%,#14101c 70%);z-index:5}
.scr[hidden],.modal[hidden],#hud[hidden]{display:none}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:34px;letter-spacing:6px;margin:18px 0 2px;text-align:center;color:var(--gold);text-shadow:0 2px 0 #6a3f10,0 0 18px #f2c14e55}
h2{font-size:20px;margin:6px 0 10px;color:var(--gold)}
.sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#120e19;color:var(--ink);margin-bottom:10px}
.btn{font:inherit;font-size:15px;border:0;border-radius:11px;padding:11px 14px;background:#3a2f4a;color:var(--ink);cursor:pointer;width:100%;margin-bottom:8px;font-weight:600}
.btn.pri{background:linear-gradient(#f5cd62,#d89c2a);color:#2a1a06}
.btn.red{background:linear-gradient(#e8665e,#a8312b);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
.msg{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 6px}
.sects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sect{background:#1a1424;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.sect.on{border-color:var(--gold);background:#2a2034}
.sect b{display:block;font-size:16px;margin:4px 0 2px}.sect small{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.sect canvas{width:72px;height:80px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0 12px;line-height:1.45}.chk input{width:22px;height:22px;margin:0;flex:none}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--dim)}.kv b{color:var(--ink)}
.bar{height:12px;background:#0d0a12;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd0a0,#b6f07a)}
.dao{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--x),#3a2f4a 50%,var(--z));margin:8px 0 2px}
.dao i{position:absolute;top:-4px;width:6px;height:22px;background:#fff;border-radius:3px;box-shadow:0 0 6px #fff;transform:translateX(-3px)}
.daol{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;background:#3a2f4a;margin:2px 4px 2px 0}
.tag.z{background:#1f3a55;color:#bfe2ff}.tag.x{background:#551f24;color:#ffc9c4}.tag.hc{background:#5a1010;color:#ffd0c0}.tag.warn{background:#5a4210;color:#ffe2a0}
.log{font-size:12px;color:var(--dim);max-height:120px;overflow:auto;line-height:1.6}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}.list .it div{font-size:14px}.list .it small{display:block;color:var(--dim);font-size:12px}
.list .it .btn{width:auto;margin:0;padding:8px 12px;font-size:13px;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.top .btn{width:auto;margin:0;padding:7px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dim);font-weight:500}
/* 局內 */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;padding-top:env(safe-area-inset-top)}
#xpb{height:9px;background:#0008;margin:0}#xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbfff,#a7f0ff)}
#hrow{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:13px;text-shadow:0 1px 2px #000}
#htime{font-size:20px;font-weight:700;color:#fff}
#pause{pointer-events:auto;font:inherit;background:#0007;color:#fff;border:1px solid #fff4;border-radius:8px;padding:4px 10px;font-size:14px}
#skrow{display:flex;gap:3px;padding:0 8px;flex-wrap:wrap}
.si{width:24px;height:24px;border-radius:6px;background:#0008;border:1px solid #fff3;font-size:12px;display:grid;place-items:center;position:relative;color:#fff}
.si sup{position:absolute;right:-2px;bottom:-4px;font-size:9px;color:var(--gold)}
.si.p{border-color:#5fd0a066}.si.m{border-color:var(--gold)}.si.e{border-color:#ff7a3a;box-shadow:0 0 6px #ff7a3a}.si.sd{border-color:#e0524a}
#bossb{margin:6px 12px 0;display:none}#bossb b{font-size:13px;text-shadow:0 1px 2px #000}#bossb .bar{height:10px;margin:3px 0}#bossb .bar i{background:linear-gradient(90deg,#e0524a,#ff9a6a)}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:24px;font-weight:800;color:#fff;text-shadow:0 0 10px #000,0 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4;padding:0 20px}
.modal{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.mbox h2{text-align:center}
.opt{display:flex;gap:10px;align-items:center;background:#1a1424;border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.opt .ic{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:800;background:#2a2034;color:var(--gold)}
.opt b{font-size:15px}.opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px;line-height:1.35}
.opt .lv{font-size:11px;color:var(--jade);margin-left:4px}
.opt.evo{border-color:#ff7a3a;background:#2c1a14}.opt.evo .ic{background:#ff7a3a;color:#2a1006}
.opt.side{border-color:#7a5aa0}.opt.side.x{border-color:var(--red)}
.center{text-align:center}
.res p{margin:6px 0;font-size:14px;line-height:1.5}
.big{font-size:26px;font-weight:800;text-align:center;margin:8px 0}
.off{font-size:12px;color:#ffd27a;text-align:center;margin:-8px 0 12px}
.cur{display:flex;gap:14px;align-items:center;font-weight:700;font-size:15px}.cur i{font-style:normal;display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px}
.ist{background:linear-gradient(135deg,#e6d4ff,#7a4fd0);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.ijd{background:linear-gradient(135deg,#bff7e0,#2aa87a);clip-path:polygon(50% 0,90% 50%,50% 100%,10% 50%)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;touch-action:pan-x}.tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;border-radius:20px;padding:8px 16px;border:1px solid var(--line);background:#2e2440;color:var(--dim)}.tabs button.on{background:var(--gold);color:#2a1a06;border-color:var(--gold)}
.prev{position:relative;background:radial-gradient(circle at 50% 55%,#3a2a50,#1a1426 70%);border:1px solid var(--line);border-radius:18px;height:300px;margin-bottom:12px;overflow:hidden}
.prev canvas{position:absolute;left:50%;top:0;transform:translateX(-50%);width:260px;height:300px}
.prev .pn{position:absolute;left:14px;top:12px;font-weight:800;font-size:20px}.prev .pr{position:absolute;left:14px;top:42px}
.prev .pb{position:absolute;right:12px;bottom:12px;left:12px;display:flex;gap:8px}.prev .pb .btn{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.it2{position:relative;border-radius:14px;border:2px solid var(--line);background:#1c1628;padding:6px 4px 8px;text-align:center;cursor:pointer}
.it2 canvas{width:100%;height:auto;display:block;aspect-ratio:1}.it2 b{display:block;font-size:13px;margin-top:2px}.it2 small{display:block;font-size:12px;margin-top:2px;color:var(--dim)}
.it2.sel{outline:3px solid var(--gold)}.it2 .wearing{position:absolute;top:6px;left:6px;font-size:11px;background:var(--gold);color:#2a1a06;border-radius:8px;padding:1px 6px;font-weight:800}
.rar{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;border:1px solid}
.gban{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#5a2a6a,#1a1030 75%);border:1px solid #6a4a90;height:340px;margin-bottom:12px}
.gban canvas{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:280px;height:300px}.gban h2{position:absolute;top:10px;left:0;right:0;text-align:center;margin:0}.gban p{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:13px;color:#d8c0e8;margin:0}
.odds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}.odds div{border:1px solid;border-radius:10px;padding:6px 2px;text-align:center;font-size:12px}.odds b{display:block;font-size:15px;color:#fff}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pk{position:relative;border-radius:14px;border:2px solid #2aa87a88;background:linear-gradient(#183a30,#141a1c);padding:12px 8px;text-align:center;cursor:pointer}
.pk b{display:block;font-size:22px;color:#bff7e0}.pk small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.pk .pp{margin-top:8px;background:var(--gold);color:#2a1a06;border-radius:10px;padding:6px;font-weight:800}
.pk .dbl{position:absolute;top:-8px;right:-4px;background:#e0524a;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.res .r1{border-radius:10px;border:2px solid;padding:4px 2px;text-align:center;font-size:11px;background:#1c1628;position:relative}.res .r1 canvas{width:100%;aspect-ratio:1;display:block}.res .new{position:absolute;top:2px;right:2px;font-size:10px;background:#e0524a;color:#fff;border-radius:6px;padding:0 4px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div id="xpb"><i></i></div>
  <div id="hrow"><span id="hlv">Lv 1</span><span id="htime">5:00</span><span><span id="hkill">0</span> 殺 <button id="pause" type="button">❚❚</button></span></div>
  <div id="skrow"></div>
  <div id="bossb"><b id="bossn"></b><div class="bar"><i id="bossh"></i></div></div>
</div>
<div id="banner"></div>
<div class="scr" id="sLogin" hidden><div class="wrap">
  <h1>萬妖仙途</h1><div class="sub">四大門派・正邪兩道・萬妖割草修仙</div>
  <div class="off" id="offNote" hidden>目前是離線試玩：進度存在這台裝置上</div>
  <div class="card" id="loginCard">
    <input id="lName" placeholder="道號（2～12 字）" maxlength="12" autocomplete="username">
    <input id="lPass" type="password" placeholder="密碼" autocomplete="current-password">
    <div class="msg" id="lMsg"></div>
    <div class="row"><button class="btn pri" id="bLogin">登入</button><button class="btn" id="bReg">註冊</button></div>
  </div>
  <button class="btn ghost" id="bOffline" hidden>離線試玩</button>
  <div class="center" style="font-size:12px;margin-top:10px"><a href="privacy.html" id="lPriv" target="_blank" rel="noopener" style="color:var(--dim)">隱私權政策</a></div>
</div></div>
<div class="scr" id="sCreate" hidden><div class="wrap">
  <h2>拜入山門</h2><div class="sub" style="text-align:left">選擇你的門派。到了金丹期的心魔劫，你會依道心踏上正道或邪道。</div>
  <input id="cName" placeholder="你的道號（離線試玩用）" maxlength="12" hidden>
  <div class="sects" id="sectList"></div>
  <label class="chk"><input type="checkbox" id="hc"><span><b style="color:#ff9a7a">一命修仙（硬核）</b><br><small style="color:var(--dim)">死一次就永久消失，不能用保命法寶。修為獲得 ×1.3，登上專屬排行榜。</small></span></label>
  <div class="msg" id="cMsg"></div>
  <button class="btn pri" id="bCreate">踏上仙途</button>
</div></div>
<div class="scr" id="sHome" hidden><div class="wrap" id="home"></div></div>
<div class="scr" id="sPage" hidden><div class="wrap" id="page"></div></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script src="xian-config.js"></script>
<script src="xian-data.js"></script>
<script src="xian-art.js"></script>
<script>
'use strict';
const D=window.XD,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
// ======================= 連線／離線 =======================
const NET={online:false,token:'',name:'',p:null};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let memSave=null; // 預覽環境沒有 localStorage 時，存在記憶體
// 伺服器位置：網頁版用同一個網址；App 版在 xian-config.js 指定（例如 https://xiuxian.onrender.com）
const BASE=(window.XIAN_SERVER||'').replace(/\/$/,''),IS_APP=!!window.XIAN_APP;
async function api(path,body){
  const r=await fetch(BASE+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-token':NET.token},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'伺服器沒有回應'}));if(!r.ok)throw new Error(j.error||'發生錯誤');return j}
function localLoad(){const s=LS.get('xian-local')||memSave;try{return s?JSON.parse(s):null}catch(e){return null}}
function localSave(){const s=JSON.stringify(NET.p);memSave=s;LS.set('xian-local',s)}
async function doAct(a){
  if(NET.online){const j=await api('/api/act',a);NET.p=j.p;return j}
  const out=D.act(NET.p,a,null);if(!out.ok)throw new Error(out.msg);localSave();return out}
async function startRun(mode){if(NET.online){const j=await api('/api/runstart',{mode});return j.runId}return 'local'}
// 檢查有沒有伺服器：最多等 2 秒，不行就當作離線（預覽環境可能不會回應）
async function probe(ms=2000){if(!IS_APP&&(location.protocol==='file:'||/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)))return false;
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);const r=await fetch(BASE+'/healthz',{cache:'no-store',signal:c.signal});clearTimeout(t);return r.ok&&(await r.text()).trim()==='ok'}catch(e){return false}}
// ======================= 畫面切換 =======================
function show(id){for(const s of ['sLogin','sCreate','sHome','sPage'])$('#'+s).hidden=s!==id}
function modal(html,bind){$('#mbox').innerHTML=html;$('#modal').hidden=false;if(bind)bind($('#mbox'))}
function closeModal(){$('#modal').hidden=true}
function toast(t,ms=1800,col='#fff'){const b=$('#banner');b.textContent=t;b.style.color=col;b.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>b.style.opacity=0,ms)}
// ======================= 美術（xian-art.js） =======================
const shade=XA.shade;
const lookFor=p=>XA.lookOf(p,D);
// 在小畫布上畫角色頭像（選單用）
function avatar(cv2,p,opt={}){const c=cv2.getContext('2d'),W=cv2.width,H=cv2.height;c.clearRect(0,0,W,H);const o={...lookFor(p),skinCol:XA.skinCol(p,D)};
  const s=opt.s||H/100;c.save();c.translate(W/2,H*.58);c.scale(s,s);if(o.aura&&opt.aura!==false)XA.auraDraw(c,o.aura);XA.chibi(c,o,{arm:-.3});c.restore()}
// ======================= 遊戲狀態 =======================
const cv=$('#cv'),ctx=cv.getContext('2d');let VW=240,SC=1,DPR=1,CW=0,CH=0;
let DPRCAP=2; // 跑不動時自動降低解析度
function resize(){DPR=Math.min(DPRCAP,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);VW=clamp(CW/2.3,165,380);SC=CW/VW;XA.setDensity(SC*DPR)}
addEventListener('resize',resize);resize();
let G=null; // 一局
const ST={dmg:0,spd:0,pick:0,hp:0,cdr:0,xp:0,steal:0,regen:0,dr:0};
function calcStats(){const s={dmg:0,spd:0,pick:0,hp:0,cdr:0,xp:0,steal:0,regen:0,dr:0};
  for(const k in G.pas){const P=D.PASSIVE[k];for(const e in P.per)s[e]+=P.per[e]*G.pas[k]}
  G.st=s;const oldMax=G.P.max;G.P.max=Math.round(G.base.hp*(1+s.hp));if(G.P.max>oldMax)G.P.hp+=G.P.max-oldMax}
function skillVal(a,key){const S=D.SK[a.k];let v=S.base[key]||0;if(S.up&&S.up[key])for(let i=0;i<a.lv-1;i++)v+=S.up[key][i]||0;return v}
function newRun(mode,runId){
  const p=NET.p,rs=D.runStats(p),rm=D.realmOf(p.stage);
  G={mode,runId,p,rm,map:D.MAPS[rm],t:0,dur:D.RUN[mode],P:{x:0,y:0,hp:rs.hp,max:rs.hp,f:1,inv:0,shield:0,conf:0,walk:0},
    base:rs,act:[{k:D.mainSkill(p),lv:1,cd:0,main:1}],pas:{},side:0,lv:1,xp:0,xpNeed:6,kills:0,elites:0,stones:0,dao:0,
    E:[],B:[],FX:[],O:[],Z:[],GH:[],EB:[],W:[],shrine:null,events:0,boss:null,bossDone:false,ended:false,paused:false,stack:0,
    spawnAcc:0,nextElite:40,nextSwarm:60,hunter:null,huntAt:p.hunt?rnd(40,160):-1,hunterTier:null,demonAcc:0,hdRate:D.heartDemonRate(p),
    lightAt:6,item:null,buff:{atk:0},num:[],look:lookFor(p),blade:XA.bladeOf(p,D),skin:XA.skinCol(p,D),demonLook:{...lookFor({sect:p.sect,wear:{}}),robe:'#2a1f33',shade:'#16101c',trim:'#5a2a6a',trim2:'#3a1a4a',hair:'#1a1424',hair2:'#2a2034',iris:'#e0303a',evil:1}};
  G.look.skinCol=G.skin;G.trail=G.look.trail;
  calcStats();buildSkillRow();$('#hud').hidden=false;
  for(const s of ['sLogin','sCreate','sHome','sPage'])$('#'+s).hidden=true;
  const names={normal:'歷練',tribulation:p.stage===D.PATH_STAGE-1?'心魔劫':'渡劫',forbidden:'禁地',atone:'洗心池試煉',entry:'入門試煉',punish:'宗門懲戒'};
  toast(`${names[mode]}・${G.map.n}`,2200,'#f2c14e');last=performance.now();
}
// ---------- 敵人 ----------
function mkEnemy(key,x,y,o={}){const M=D.MON[key];if(!M)return null;const mul=D.MAPMUL[G.rm]*(o.mul||1)*(G.mode==='forbidden'?1.6:1);

  if(G.act.length-G.side<D.MAX_ACT)for(const k of D.SECT_SK[p.sect])if(!own.has(k))opts.push({k:'new',sk:k,w:4});

    <div style="font-size:12px;color:var(--dim);line-height:1.6">重複獲得的造型會轉成仙緣碎片（傳說 ${G0.dupShards[4]}、史詩 ${G0.dupShards[3]}、稀有 ${G0.dupShards[2]}）。仙玉可以透過突破境界、渡劫、每日首勝取得。</div>`,m=>{
    avatar(m.querySelector('#gv'),{...p,wear:{...p.wear,outfit:G0.up,aura:'a_moon'}},{s:4.6});
    m.querySelector('#gOdds').onclick=oddsUI;m.querySelector('#gLog').onclick=glogUI;m.querySelector('#gShop').onclick=()=>{SH.tab='outfit';SH.sel=null;shopUI()};
    const pull=async n=>{try{const j=await doAct({type:'gacha',n});showPull(j.res)}catch(e){toast(e.message)}};
    m.querySelector('#g1').onclick=()=>pull(1);m.querySelector('#g10').onclick=()=>pull(10)})}
function showPull(res){const p=NET.p,best=Math.max(...res.map(x=>x.r));
  modal(`<h2 style="color:${best?D.RARITY[best].col:'#8fe0a0'}">${best===4?'✦ 傳說降臨 ✦':'祈願結果'}</h2><div class="res">${res.map((x,i)=>{const col=x.r?D.RARITY[x.r].col:'#8fe0a0';return `<div class="r1" style="border-color:${col}">${x.isNew?'<span class="new">NEW</span>':''}<canvas width="110" height="110" data-i="${i}"></canvas><div style="color:${col}">${esc(x.n)}</div>${x.dup?`<div style="color:#ffcf6a">碎片+${x.dup}</div>`:''}</div>`}).join('')}</div>
    <div style="height:10px"></div><button class="btn pri" id="mOk">好</button>`,m=>{
    m.querySelectorAll('canvas').forEach(c=>{const x=res[+c.dataset.i];if(x.k)cosIcon(c,x.k,p);else{const g=c.getContext('2d');g.fillStyle='#8fe0a0';g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('◈',55,55)}});
    m.querySelector('#mOk').onclick=()=>{closeModal();gachaUI()}})}
function oddsUI(){const G0=D.GACHA;
  modal(`<h2>完整機率表</h2><div style="font-size:13px;line-height:1.7">
    ${[4,3,2].map(r=>{const w=G0.rates.find(x=>x[0]===r)[1],pool=G0.pool[r];return `<p><b style="color:${D.RARITY[r].col}">${D.RARITY[r].n}　${(w*100).toFixed(1)}%</b><br>${pool.map(k=>{let q=w/pool.length;if(r===4)q=k===G0.up?w*G0.upShare+w*(1-G0.upShare)/pool.length:w*(1-G0.upShare)/pool.length;return `${esc(D.COS[k].n)}：${(q*100).toFixed(3)}%`}).join('<br>')}</p>`}).join('')}
    <p><b style="color:#8fe0a0">仙緣碎片 ×${G0.freeShards}　${(G0.rates[3][1]*100).toFixed(1)}%</b></p>
    <p style="color:var(--dim)">以上是單抽的基礎機率。另有保底：連續 ${G0.pity} 抽沒出傳說，第 ${G0.pity} 抽必出傳說；每 ${G0.pity10} 抽至少一件史詩以上。含保底的綜合傳說機率約 2.1%（平均約 48 抽一件）。</p></div>
    <button class="btn pri" id="mOk">關閉</button>`,m=>m.querySelector('#mOk').onclick=closeModal)}
function glogUI(){const p=NET.p;modal(`<h2>祈願紀錄</h2><div class="log" style="max-height:60vh">${(p.glog||[]).slice(0,100).map(g=>`<span style="color:${g.r?D.RARITY[g.r].col:'#8fe0a0'}">${new Date(g.at).toLocaleString('zh-TW',{hour12:false})}　${esc(g.n)}</span>`).join('<br>')||'還沒有紀錄'}</div><div style="height:8px"></div><button class="btn pri" id="mOk">關閉</button>`,m=>m.querySelector('#mOk').onclick=closeModal)}
// ======================= 帳號設定（登出、刪除帳號、隱私權） =======================
function accountUI(){const on=NET.online;
  page(`<h2>${on?'帳號設定':'存檔設定'}</h2>
    ${on?`<div class="card"><div class="kv">道號<b>${esc(NET.name)}</b></div></div><button class="btn" id="aOut">登出</button>`:'<div class="card" style="font-size:13px;color:var(--dim)">離線試玩的進度只存在這台裝置上。</div><button class="btn" id="aTitle">回到標題</button>'}
    <a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="${BASE}/privacy.html" target="_blank" rel="noopener">隱私權政策</a>
    <div class="card" style="border-color:#7a2a2a;margin-top:18px"><b style="color:#ff8a7a">${on?'刪除帳號':'清除離線存檔'}</b>
      <div style="font-size:13px;color:var(--dim);margin:6px 0 10px;line-height:1.6">${on?'會永久刪除你的帳號、角色、造型、仙玉與所有紀錄，刪除後無法復原。已儲值的仙玉也會一併消失。':'會刪除這台裝置上的離線進度，無法復原。'}</div>
      ${on?'<input id="aPass" type="password" placeholder="輸入密碼確認身分">':''}<div class="msg" id="aMsg"></div><button class="btn red" id="aDel">${on?'永久刪除帳號':'清除存檔'}</button></div>`,m=>{
    if(on)m.querySelector('#aOut').onclick=()=>{NET.token='';LS.del('xian-token');NET.p=null;goLogin()};else m.querySelector('#aTitle').onclick=()=>{NET.p=null;goLogin()};
    m.querySelector('#aDel').onclick=()=>{const pass=on?m.querySelector('#aPass').value:'';if(on&&!pass){m.querySelector('#aMsg').textContent='請先輸入密碼';return}
      modal(`<h2>確定要刪除嗎？</h2><p class="center" style="line-height:1.6">這個動作<b style="color:#ff8a7a">無法復原</b>。</p><button class="btn red" id="mGo">確定刪除</button><button class="btn ghost" id="mNo">取消</button>`,mm=>{
        mm.querySelector('#mNo').onclick=closeModal;mm.querySelector('#mGo').onclick=async()=>{closeModal();
          if(!on){LS.del('xian-local');memSave=null;NET.p=null;toast('已清除離線存檔');goLogin();return}
          try{await api('/api/delete-account',{pass});NET.token='';LS.del('xian-token');NET.p=null;toast('帳號已刪除',2200);goLogin()}catch(e){m.querySelector('#aMsg').textContent=e.message}}})}})}
// ======================= 登入／建角 =======================
function goLogin(){show('sLogin');$('#lPriv').href=BASE+'/privacy.html';$('#offNote').hidden=NET.online;$('#loginCard').hidden=!NET.online;$('#bOffline').hidden=NET.online;if(!NET.online)$('#bOffline').textContent=localLoad()?'繼續離線試玩':'開始離線試玩'}
async function auth(path){const name=$('#lName').value.trim(),pass=$('#lPass').value;$('#lMsg').textContent='';
  try{const j=await api(path,{name,pass});NET.token=j.token;LS.set('xian-token',j.token);await loadMe()}catch(e){$('#lMsg').textContent=e.message}}
async function loadMe(){const j=await api('/api/me');NET.name=j.name;NET.p=j.p;if(!j.p||j.p.dead)goCreate(j.p);else goHome()}
$('#bLogin').onclick=()=>auth('/api/login');$('#bReg').onclick=()=>auth('/api/register');
$('#bOffline').onclick=()=>{NET.p=localLoad();if(!NET.p||NET.p.dead)goCreate(NET.p);else goHome()};
let pickSect='sword';
function goCreate(dead){show('sCreate');$('#cName').hidden=NET.online;
  $('#sectList').innerHTML=Object.entries(D.SECTS).map(([k,S])=>`<div class="sect ${k===pickSect?'on':''}" data-s="${k}"><canvas width="180" height="200"></canvas><b style="color:${S.col}">${S.n}</b><small>${S.desc}</small><small style="margin-top:4px">正：${D.PATHLINE[k].z}・邪：${D.PATHLINE[k].x}</small></div>`).join('');
  $('#sectList').querySelectorAll('.sect').forEach(d=>{avatar(d.querySelector('canvas'),{sect:d.dataset.s,wear:{}});d.onclick=()=>{pickSect=d.dataset.s;goCreate(dead)}});
  $('#cMsg').textContent=dead?`${dead.name} 已身死道消（${D.stageName(dead.stage)}）。重新踏上仙途吧。`:''}
$('#bCreate').onclick=async()=>{const hc=$('#hc').checked;
  try{if(NET.online){const j=await api('/api/create',{sect:pickSect,hardcore:hc});NET.p=j.p}else{NET.p=D.newProfile(($('#cName').value.trim()||'無名散修').slice(0,12),pickSect,hc);localSave()}goHome()}catch(e){$('#cMsg').textContent=e.message}};
// ======================= 啟動 =======================
async function boot(){
  if(IS_APP){ // App 一定要連線：免費伺服器睡著時要等它醒來
    modal('<h2>連線中</h2><p class="center" style="line-height:1.6">正在連上伺服器……<br><small style="color:var(--dim)">伺服器閒置時需要喚醒，最多約一分鐘</small></p>');
    let ok=false;for(let i=0;i<4&&!ok;i++)ok=await probe(20000);closeModal();
    if(!ok){modal('<h2>連不上伺服器</h2><p class="center">請確認網路後再試一次。</p><button class="btn pri" id="mRe">重試</button>',m=>m.querySelector('#mRe').onclick=()=>{closeModal();boot()});return}
    NET.online=true}
  else{try{NET.online=await probe()}catch(e){NET.online=false}}
  if(NET.online){NET.token=LS.get('xian-token')||'';if(NET.token){try{await loadMe();return}catch(e){NET.token=''}}}
  goLogin()}
boot();
// 測試用掛鉤
window.topupUI=topupUI;window.__X={get G(){return G},NET,D,newRun,endRun,goHome,startRun,JOY,spawnAround,options,applyOpt,closeModal,set TS(v){TS=v},get FPS(){return FPS}};
</script>
</body>
</html>
