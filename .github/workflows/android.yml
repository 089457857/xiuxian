# 打包 Android App：每次推上 GitHub（或手動按 Run workflow）就會自動打包
# 產出：測試用 APK（可直接安裝在 Android 手機）；有設定上傳金鑰時，另外產出上架用的 AAB
name: 打包 Android App
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'xian-*.js', 'privacy.html', 'app/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 建立 App 網頁檔
        working-directory: app
        run: |
          npm ci
          node build-app.js
          npx cap sync android
      - name: 還原上傳金鑰
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "XIAN_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: 打包測試用 APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 打包上架用 AAB
        if: env.HAS_KEY == 'true'
        working-directory: app/android
        env:
          XIAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: 上傳測試用 APK
        uses: actions/upload-artifact@v4
        with:
          name: 萬妖仙途-測試版-APK
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: 上傳上架用 AAB
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 萬妖仙途-上架用-AAB
          path: app/android/app/build/outputs/bundle/release/*.aab
