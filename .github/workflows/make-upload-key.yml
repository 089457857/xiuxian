# 產生上架用的「上傳金鑰」（只需要做一次）
# 事前：先在 Settings → Secrets and variables → Actions 新增 ANDROID_KEYSTORE_PASSWORD（自己取一組密碼）
# 執行後到這次執行的頁面下載 upload-key，裡面的 .base64.txt 內容要貼到 Secrets 的 ANDROID_KEYSTORE_BASE64
# 下載的檔案只保留 1 天，請把 upload.jks 和密碼一起備份在安全的地方
name: 產生上傳金鑰（只做一次）
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 產生金鑰
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "請先在 Secrets 新增 ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Wanyao Xiantu, O=Wanyao, C=TW"
          base64 -w0 upload.jks > upload.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upload-key
          path: |
            upload.jks
            upload.jks.base64.txt
          retention-days: 1
